[package]
name = "nihongo"
version = "0.4.0"
description = "Koihongo: a pixel-art Windows app for learning Japanese"
authors = ["Xel"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nihongo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
# AI over HTTP APIs (ai_api.rs) and API keys in the OS credential store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Reading (books.rs): picking your manga folders and .cbz files, and reading pages out of .cbz (zip) files.
tauri-plugin-dialog = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# Reading the text in a box (ocr.rs): the manga-ocr model run by ONNX Runtime (prebuilt, linked in at
# build time), PNG cut-outs from the window, and checking the downloaded model files.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
lindera = { version = "=6.2.0", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
